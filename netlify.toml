[build]
  publish = "."
  functions = "netlify/functions"
  command = "rm -rf node_modules && npm install && npx tailwindcss -i ./src/input.css -o ./dist/styles.css --minify"

[build.environment]
  NODE_VERSION = "18"

[[redirects]]
  from = "/presentes/:id"
  to = "/presentes/presente.html"
  status = 200
  force = true

[[plugins]]
  package = "@netlify/plugin-functions-install-core"