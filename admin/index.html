<!doctype html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="shortcut icon" href="/img/logo_laranja.png" type="image/x-icon" />
  <title>Login Admin — Giovanna & Erick</title>

  <!-- Tailwind compilado (mesmo da home) -->
  <link href="/dist/styles.css" rel="stylesheet">

  <style>
    @font-face {
      font-family: "Oleragie";
      src: url("/fonts/Oleragie.otf") format("opentype");
      font-display: swap;
    }
    @font-face {
      font-family: "Satoshi";
      src: url("/fonts/Satoshi-Variable.ttf") format("truetype");
      font-weight: 300 900;
      font-display: swap;
    }

    body {
      font-family: "Satoshi", "Jost", -apple-system, sans-serif;
      font-weight: 300;
      line-height: 1.75;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      75% { transform: translateX(5px); }
    }

    .shake { animation: shake 0.4s ease; }
  </style>
</head>

<body class="bg-creme text-marrom font-light text-base min-h-screen flex items-center justify-center p-4 relative overflow-hidden">

  <!-- Fundo decorativo (consistente com o estilo da página inicial) -->
  <div class="absolute inset-0 pointer-events-none" aria-hidden="true">
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 text-[35rem] opacity-[0.03] grayscale select-none">🎁</div>
    <div class="absolute inset-0 bg-[radial-gradient(ellipse_70%_80%_at_15%_50%,rgba(243,198,35,0.08)_0%,transparent_55%),radial-gradient(ellipse_60%_70%_at_85%_40%,rgba(214,51,132,0.06)_0%,transparent_55%)]"></div>
  </div>

  <!-- Cartão de login -->
  <div class="relative z-10 w-full max-w-[440px] bg-white rounded-3xl shadow-[0_20px_40px_rgba(58,31,16,0.12),0_4px_12px_rgba(58,31,16,0.06)] border border-marrom/8 p-8 sm:p-10 transition-transform duration-300 hover:-translate-y-1">

    <div class="text-center mb-6">
      <h1 class="font-titulos font-semibold text-1xl text-marrom leading-tight">
        Área <em class="italic text-rosa font-bold">Administrativa</em>
      </h1>
      <hr class="w-[60px] h-[2px] bg-gradient-to-r from-rosa to-amarelo border-none my-4 mx-auto" />
      <p class="text-marrom-claro text-[0.85rem] tracking-wide">Gerenciamento de presentes — Giovanna & Erick</p>
    </div>

    <!-- Mensagem de erro -->
    <div id="errorMsg" class="hidden bg-rosa/8 text-rosa px-4 py-3 rounded-xl mb-5 text-sm text-center border-l-[3px] border-rosa font-normal">
      <span id="errorText">Senha incorreta</span>
    </div>

    <!-- Campo de senha -->
    <div class="mb-5">
      <label for="password" class="block text-[0.7rem] tracking-[0.15em] uppercase text-terracota font-medium mb-2">
        🔒 Acesso Restrito
      </label>
      <input type="password" id="password" placeholder="Digite a senha administrativa" autocomplete="off"
        class="w-full px-4 py-3.5 border-[1.5px] border-marrom/12 rounded-xl bg-creme text-base text-marrom placeholder:text-marrom/30 focus:outline-none focus:border-rosa focus:bg-white focus:ring-[3px] focus:ring-rosa/10 transition-all duration-300" />
    </div>

    <!-- Botão -->
    <button onclick="login()" id="loginBtn"
      class="w-full py-3.5 bg-gradient-to-br from-rosa to-laranja text-white rounded-xl text-[0.85rem] font-semibold tracking-[0.15em] uppercase transition-all duration-300 hover:-translate-y-0.5 hover:shadow-[0_6px_20px_rgba(214,51,132,0.3)] active:translate-y-0 relative overflow-hidden group">
      <span class="relative z-10">➜ Entrar no painel</span>
      <span class="absolute inset-0 bg-gradient-to-r from-transparent via-white/20 to-transparent -translate-x-full group-hover:translate-x-full transition-transform duration-500"></span>
    </button>

    <!-- Rodapé -->
    <div class="mt-6 pt-5 border-t border-marrom/8 text-center text-[0.7rem] text-marrom-claro">
      <span class="font-paragrafos italic">apenas para organizadores</span>
    </div>
  </div>

  <script>
    async function login() {
      const password = document.getElementById('password').value;
      const errorDiv = document.getElementById('errorMsg');
      const errorText = document.getElementById('errorText');
      const loginBtn = document.getElementById('loginBtn');

      errorDiv.classList.add('hidden');
      errorDiv.classList.remove('shake');

      if (!password) {
        errorText.textContent = 'Por favor, digite a senha';
        errorDiv.classList.remove('hidden');
        errorDiv.classList.add('shake');
        return;
      }

      loginBtn.disabled = true;
      loginBtn.style.opacity = '0.7';
      const originalText = loginBtn.innerHTML;
      loginBtn.innerHTML = '<span class="relative z-10">⌛ Verificando...</span>';

      try {
        const response = await fetch('/.netlify/functions/admin-auth', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password })
        });

        const data = await response.json();

        if (data.success) {
          sessionStorage.setItem('admin_authenticated', 'true');
          sessionStorage.setItem('admin_login_time', Date.now().toString());
          loginBtn.innerHTML = '<span class="relative z-10">✓ Redirecionando...</span>';
          setTimeout(() => {
            window.location.href = '/admin/dashboard.html';
          }, 500);
        } else {
          errorText.textContent = '❌ Senha incorreta. Acesso negado.';
          errorDiv.classList.remove('hidden');
          errorDiv.classList.add('shake');
          loginBtn.disabled = false;
          loginBtn.style.opacity = '1';
          loginBtn.innerHTML = originalText;
          document.getElementById('password').value = '';
          document.getElementById('password').focus();
        }
      } catch (error) {
        console.error('Erro:', error);
        errorText.textContent = '⚠️ Erro ao conectar com o servidor. Tente novamente.';
        errorDiv.classList.remove('hidden');
        errorDiv.classList.add('shake');
        loginBtn.disabled = false;
        loginBtn.style.opacity = '1';
        loginBtn.innerHTML = originalText;
      }
    }

    document.getElementById('password').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); login(); }
    });

    document.getElementById('password').focus();

    // Se já estiver logado (sessão de 8h), redireciona direto
    if (sessionStorage.getItem('admin_authenticated') === 'true') {
      const loginTime = parseInt(sessionStorage.getItem('admin_login_time') || '0');
      if (Date.now() - loginTime < 8 * 60 * 60 * 1000) {
        window.location.href = '/admin/dashboard.html';
      } else {
        sessionStorage.removeItem('admin_authenticated');
        sessionStorage.removeItem('admin_login_time');
      }
    }
  </script>
</body>

</html>
