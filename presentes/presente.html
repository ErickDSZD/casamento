    /* Fontes e pequenos ajustes que o Tailwind não cobre */
    @font-face {
      font-family: "Oleragie";

      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "Satoshi";
      src: url("../fonts/Satoshi-Variable.ttf") format("truetype");
      font-weight: 300 900;
      font-style: normal;
      font-display: swap;
    }

    html {
      scroll-behavior: smooth;

    body {
      font-family: "Satoshi", "Jost", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-weight: 300;
      line-height: 1.75;

    /* Inputs do Mercado Pago (não dá para estilizar via Tailwind) */
    .mp-card-field iframe {
      height: 48px !important;
      border-radius: 12px;
    }

    /* Toast animation */
    @keyframes slideIn {
      from { transform: translateX(100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }

    .toast-anim {
      animation: slideIn 0.3s ease;
    }

    /* Esconde o spinner do input number */
    input[type="number"]::-webkit-outer-spin-button,
    input[type="number"]::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
  </style>

  <script>
    const toggle = document.getElementById("navToggle");
    const links = document.getElementById("navLinks");
    const mobileMenu = document.getElementById("mobileMenu");

    function closeMobileMenu() {
      mobileMenu.classList.add("hidden");
      mobileMenu.classList.remove("flex");
      toggle.querySelectorAll("span").forEach((s) => {
        s.style.transform = "";
        s.style.opacity = "";
      });
      toggle.setAttribute("aria-expanded", "false");
    }

    if (toggle && mobileMenu) {
      toggle.addEventListener("click", () => {
        const isOpen = !mobileMenu.classList.contains("hidden");
        if (isOpen) {
          closeMobileMenu();
        } else {
          mobileMenu.classList.remove("hidden");
          mobileMenu.classList.add("flex");
          toggle.setAttribute("aria-expanded", "true");
          const spans = toggle.querySelectorAll("span");
          spans[0].style.transform = "translateY(6.8px) rotate(45deg)";
          spans[1].style.opacity = "0";
          spans[2].style.transform = "translateY(-6.5px) rotate(-45deg)";
        }
      });

      mobileMenu.querySelectorAll("a").forEach((a) => {
        a.addEventListener("click", closeMobileMenu);
      });
    }
  </script>

    function getIdFromURL() {
      const path = window.location.pathname;
      const parts = path.split('/').filter(Boolean);
      return parts[parts.length - 1];

    function capitalizar(str) {
      if (!str) return "";
      return str.charAt(0).toUpperCase() + str.slice(1);
    }

    function escapeHTML(str) {
      if (!str) return "";
      const div = document.createElement("div");
      div.textContent = str;
      return div.innerHTML;
    }

    function showToast(message, type = "success") {
      const toast = document.createElement("div");
      const bgClass = type === "success" ? "bg-[#10b981]" : type === "error" ? "bg-[#ef4444]" : "bg-marrom";
      toast.className = `toast-anim fixed bottom-4 right-4 left-4 sm:left-auto bg-marrom text-white px-4 py-3 sm:px-6 sm:py-4 rounded-xl z-[1001] text-sm sm:text-base ${bgClass}`;
      toast.textContent = message;
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 4000);

      `;

    function copiarEndereco() {
      const enderecoCompleto = `Rua Duque de Caxias, 815\nOlímpia - SP\nCEP: 15402-072`;
      navigator.clipboard.writeText(enderecoCompleto)
        .then(() => showToast("Endereço copiado com sucesso!", "success"))
        .catch(() => {
          const textarea = document.createElement("textarea");
          textarea.value = enderecoCompleto;
          document.body.appendChild(textarea);
          textarea.select();
          document.execCommand("copy");
          document.body.removeChild(textarea);
          showToast("Endereço copiado com sucesso!", "success");
        });
    }

    function applyDocumentMask(input) {
      let value = input.value.replace(/\D/g, '');
      if (value.length > 14) value = value.slice(0, 14);
      if (value.length <= 11) {
        if (value.length <= 3) input.value = value;
        else if (value.length <= 6) input.value = `${value.slice(0, 3)}.${value.slice(3)}`;
        else if (value.length <= 9) input.value = `${value.slice(0, 3)}.${value.slice(3, 6)}.${value.slice(6)}`;
        else input.value = `${value.slice(0, 3)}.${value.slice(3, 6)}.${value.slice(6, 9)}-${value.slice(9, 11)}`;
      } else {
        if (value.length <= 2) input.value = value;
        else if (value.length <= 5) input.value = `${value.slice(0, 2)}.${value.slice(2)}`;
        else if (value.length <= 8) input.value = `${value.slice(0, 2)}.${value.slice(2, 5)}.${value.slice(5)}`;
        else if (value.length <= 12) input.value = `${value.slice(0, 2)}.${value.slice(2, 5)}.${value.slice(5, 8)}/${value.slice(8)}`;
        else input.value = `${value.slice(0, 2)}.${value.slice(2, 5)}.${value.slice(5, 8)}/${value.slice(8, 12)}-${value.slice(12, 14)}`;
      }
    }

    function setupDocumentMaskListeners() {
      const c = document.getElementById("form-checkout__identificationNumber");
      const d = document.getElementById("debit-form-checkout__identificationNumber");
      if (c) c.addEventListener("input", () => applyDocumentMask(c));
      if (d) d.addEventListener("input", () => applyDocumentMask(d));
    }

    function clearSelectAndSetPlaceholder(element, placeholder) {
      if (!element) return;
      element.innerHTML = "";
      const option = document.createElement("option");
      option.value = "";
      option.disabled = true;
      option.selected = true;
      option.textContent = placeholder;
      element.appendChild(option);
    }

    function createSelectOptions(elem, options, labelsAndKeys = { label: "name", value: "id" }) {
      if (!elem) return;
      const { label, value } = labelsAndKeys;
      const currentValue = elem.value;
      const hasPlaceholder = elem.options.length === 1 && elem.options[0]?.disabled;
      if (hasPlaceholder) {
        elem.innerHTML = "";
        const placeholder = document.createElement("option");
        placeholder.value = "";
        placeholder.disabled = true;
        placeholder.selected = true;
        placeholder.textContent = elem.options[0]?.textContent || "Selecione uma opção";
        elem.appendChild(placeholder);
      } else {
        const placeholder = elem.querySelector("option[disabled][selected]");
        elem.innerHTML = "";
        if (placeholder) elem.appendChild(placeholder.cloneNode(true));
      }
      options.forEach((option) => {
        const optValue = option[value];
        const optLabel = option[label];
        const opt = document.createElement("option");
        opt.value = optValue;
        opt.textContent = optLabel;
        if (currentValue && optValue == currentValue) opt.selected = true;
        elem.appendChild(opt);
      });
    }

    async function initMercadoPago() {

        await initMercadoPago();
        const list = await mp.getIdentificationTypes();
        identificationTypes = list;
        const cs = document.getElementById("form-checkout__identificationType");
        const ds = document.getElementById("debit-form-checkout__identificationType");
        if (cs) createSelectOptions(cs, list);
        if (ds) createSelectOptions(ds, list);
        return list;
      } catch (e) {
        console.error("Error getting identificationTypes: ", e);
        return [];
      }
    }

    async function getIssuers(paymentMethodId, bin) {
      try {
        if (!paymentMethodId || !bin) return [];
        const issuers = await mp.getIssuers({ paymentMethodId, bin });
        if (issuers && Array.isArray(issuers) && issuers.length > 0) {
          return issuers.map(issuer => ({ id: issuer.id, name: issuer.name }));
        }
        return [];
      } catch (e) {
        console.error("Erro ao buscar issuers com SDK:", e);
        return [];
      }
    }

    async function getInstallments(amount, bin, paymentMethodId) {
      try {
        if (!amount || amount === '') return [];
        let amountStr = String(amount).trim().replace(/[R$\s]/g, '').replace(',', '.');
        const amountNumber = parseFloat(amountStr);
        if (isNaN(amountNumber) || amountNumber <= 0) return [];
        const response = await mp.getInstallments({ amount: amountStr, bin, paymentTypeId: 'credit_card' });
        if (response && response.length > 0) {
          let info = response[0];
          if (paymentMethodId) {
            const found = response.find(item => item.payment_method_id === paymentMethodId);
            if (found) info = found;
          }
          if (info && info.payer_costs && info.payer_costs.length > 0) return info.payer_costs;
        }
        return [];
      } catch (e) {
        console.error("Erro ao buscar parcelas com SDK:", e);
        return [];
      }
    }

    let debounceTimeout = null;

    async function setupCardBinListener(cardNumberElement, type = "credit") {
      if (!cardNumberElement) return;
      const issuerElementId = type === "credit" ? "form-checkout__issuer" : "debit-form-checkout__issuer";
      const installmentsElementId = type === "credit" ? "form-checkout__installments" : "debit-form-checkout__installments";
      const paymentMethodIdInputId = type === "credit" ? "paymentMethodId" : "debit-paymentMethodId";
      const issuerElement = document.getElementById(issuerElementId);
      const installmentsElement = document.getElementById(installmentsElementId);
      const paymentMethodIdInput = document.getElementById(paymentMethodIdInputId);

      cardNumberElement.on("binChange", async (data) => {
        const { bin } = data;
        if (debounceTimeout) clearTimeout(debounceTimeout);
        debounceTimeout = setTimeout(async () => {
          try {
            if (!bin || bin.length < 6) {
              if (issuerElement) clearSelectAndSetPlaceholder(issuerElement, "Selecione o banco");
              if (installmentsElement) clearSelectAndSetPlaceholder(installmentsElement, "Selecione as parcelas");
              if (paymentMethodIdInput) paymentMethodIdInput.value = "";
              currentBin = null;
              return;
            }
            if (bin !== currentBin) {
              const { results } = await mp.getPaymentMethods({ bin });
              const paymentMethod = results[0];
              if (paymentMethod) {
                if (paymentMethodIdInput) paymentMethodIdInput.value = paymentMethod.id;
                updatePCIFieldsSettings(paymentMethod, cardNumberElement,
                  type === "credit" ? creditCardFields?.securityCode : debitCardFields?.securityCode);
                if (type === "credit") {
                  const issuers = await getIssuers(paymentMethod.id, bin);
                  if (issuerElement) {
                    if (issuers.length > 0) createSelectOptions(issuerElement, issuers, { label: "name", value: "id" });
                    else clearSelectAndSetPlaceholder(issuerElement, "Banco emissor (não disponível)");
                  }
                  const amount = currentPresente?.preco || 100;
                  let cleanAmount = amount;
                  if (typeof cleanAmount === 'string') cleanAmount = cleanAmount.replace(/[R$\s]/g, '').replace(',', '.');
                  cleanAmount = parseFloat(cleanAmount);
                  const installmentOptions = await getInstallments(String(cleanAmount), bin, paymentMethod.id);
                  if (installmentsElement) {
                    if (installmentOptions.length > 0) {
                      createSelectOptions(installmentsElement, installmentOptions, {
                        label: "recommended_message", value: "installments"
                      });
                    } else {
                      clearSelectAndSetPlaceholder(installmentsElement, "Selecione as parcelas");
                      if (!isNaN(cleanAmount) && cleanAmount > 0) {
                        const fallback = [{ installments: 1, recommended_message: `1x de R$ ${cleanAmount.toFixed(2)} sem juros`, total_amount: cleanAmount }];
                        createSelectOptions(installmentsElement, fallback, { label: "recommended_message", value: "installments" });
                      }
                    }
                  }
                }
              }
              currentBin = bin;
            }
          } catch (e) { console.error("error in binChange: ", e); }
        }, 500);
      });
    }

    function updatePCIFieldsSettings(paymentMethod, cardNumberElement, securityCodeElement) {
      if (!paymentMethod?.settings?.[0]) return;
      const { settings } = paymentMethod;
      const c = settings[0]?.card_number;
      const s = settings[0]?.security_code;
      if (c && cardNumberElement) cardNumberElement.update({ settings: c });
      if (s && securityCodeElement) securityCodeElement.update({ settings: s });
    }

    async function initCreditCardFields() {
      await initMercadoPago();
      await getIdentificationTypes();
      if (creditCardFields) {
        try { creditCardFields.cardNumber?.unmount(); creditCardFields.expirationDate?.unmount(); creditCardFields.securityCode?.unmount(); } catch (e) { }
        creditCardFields = null;
      }
      const cardNumber = mp.fields.create("cardNumber", { placeholder: "Número do cartão" }).mount("form-checkout__cardNumber");
      const expirationDate = mp.fields.create("expirationDate", { placeholder: "MM/YY" }).mount("form-checkout__expirationDate");
      const securityCode = mp.fields.create("securityCode", { placeholder: "Código de segurança" }).mount("form-checkout__securityCode");
      creditCardFields = { cardNumber, expirationDate, securityCode };
      await setupCardBinListener(cardNumber, "credit");
    }

    async function initDebitCardFields() {
      await initMercadoPago();
      await getIdentificationTypes();
      if (debitCardFields) {
        try { debitCardFields.cardNumber?.unmount(); debitCardFields.expirationDate?.unmount(); debitCardFields.securityCode?.unmount(); } catch (e) { }
        debitCardFields = null;
      }
      const cardNumber = mp.fields.create("cardNumber", { placeholder: "Número do cartão" }).mount("debit-form-checkout__cardNumber");
      const expirationDate = mp.fields.create("expirationDate", { placeholder: "MM/YY" }).mount("debit-form-checkout__expirationDate");
      const securityCode = mp.fields.create("securityCode", { placeholder: "Código de segurança" }).mount("debit-form-checkout__securityCode");
      debitCardFields = { cardNumber, expirationDate, securityCode };
      await setupCardBinListener(cardNumber, "debit");
    }

    function unmountCardFields() {
      if (creditCardFields) {
        try { creditCardFields.cardNumber?.unmount(); creditCardFields.expirationDate?.unmount(); creditCardFields.securityCode?.unmount(); } catch (e) { }
        creditCardFields = null;
      }
      if (debitCardFields) {
        try { debitCardFields.cardNumber?.unmount(); debitCardFields.expirationDate?.unmount(); debitCardFields.securityCode?.unmount(); } catch (e) { }
        debitCardFields = null;
      }
    }

    async function processCreditPayment() {
      const cardholderName = document.getElementById("form-checkout__cardholderName").value.toUpperCase();
      const identificationType = document.getElementById("form-checkout__identificationType").value;
      const identificationNumber = document.getElementById("form-checkout__identificationNumber").value.replace(/\D/g, "");
      const email = document.getElementById("form-checkout__email").value;
      const issuerId = document.getElementById("form-checkout__issuer")?.value;
      const installments = parseInt(document.getElementById("form-checkout__installments")?.value || "1");

      if (!cardholderName) { showToast("Preencha o nome do titular do cartão", "error"); return; }
      if (!identificationType) { showToast("Selecione o tipo de documento", "error"); return; }
      if (!identificationNumber || identificationNumber.length < 11) { showToast("Número de documento inválido", "error"); return; }
      if (!email || !email.includes("@")) { showToast("Preencha um e-mail válido", "error"); return; }
      if (installments > 1 && !issuerId) { showToast("Selecione o banco emissor para parcelamento", "error"); return; }
      if (!creditCardFields) { showToast("Sistema de pagamento não inicializado. Tente novamente.", "error"); return; }

      showToast("Processando pagamento...", "info");
      try {
        const cardToken = await mp.fields.createCardToken({ cardholderName, identificationType, identificationNumber });
        let cardBrand = "visa";
        try { const cardInfo = await mp.fields.getCardInfo(); cardBrand = cardInfo.cardNumber?.paymentMethod?.id || "visa"; } catch (e) { }
        const paymentMethodId = cardBrand === "visa" ? "visa" : cardBrand === "master" ? "master" : cardBrand === "amex" ? "amex" : "visa";
        const response = await fetch(`${API_BASE}/create-card-payment`, {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            amount: currentPresente.preco, description: currentPresente.nome, token: cardToken.id,
            paymentMethodId, installments, issuerId: issuerId || undefined,
            identificationType, identificationNumber, payerEmail: email, cardBrand, paymentType: "credit",
          }),
        });
        const data = await response.json();
        if (data.success && data.status === "approved") {
          showToast("Pagamento aprovado! Obrigado por presentear!", "success");
          setTimeout(() => { closeModal(); window.location.reload(); }, 2000);
        } else if (data.status === "in_process") {
          showToast("Pagamento em processamento. Aguarde...", "info");
          startPaymentPolling(data.paymentId);
        } else {
          throw new Error(data.statusDetail || data.error || "Pagamento não aprovado");
        }
      } catch (error) {
        console.error("Erro detalhado:", error);
        showToast(`${error.message}`, "error");
      }
    }

      if (!debitCardFields) { showToast("Sistema de pagamento não inicializado. Tente novamente.", "error"); return; }

    function getValorContribuicao() {
      if (currentPresente && currentPresente.preco > 0) return currentPresente.preco;
      if (currentPresente && currentPresente.preco === 0) {
        const inputModal = document.getElementById("valorLivreInputModal");
        if (inputModal) {
          let valor = parseFloat(inputModal.value.replace(",", "."));
          if (!isNaN(valor) && valor > 0) return valor;
        }
        const inputPage = document.getElementById("valorLivreInput");
        if (inputPage) {
          let valor = parseFloat(inputPage.value.replace(",", "."));
          if (!isNaN(valor) && valor > 0) return valor;
        }
        showToast("Por favor, insira um valor válido", "error");
        return null;
      }
      return null;
    }

    async function generatePixQRCode() {
      const amount = getValorContribuicao();
      if (!amount) return;
      const pixEmail = document.getElementById("pixEmail")?.value;
      if (!pixEmail || !pixEmail.includes("@")) { showToast("Por favor, informe um e-mail válido", "error"); return; }

      const pixPlaceholder = document.getElementById("pixPlaceholder");
      const pixGeneratedContent = document.getElementById("pixGeneratedContent");
      const qrContainer = document.getElementById("qrCodeContainer");
      const pixCodeElement = document.getElementById("pixCode");

      pixPlaceholder?.classList.add("hidden");
      pixGeneratedContent?.classList.remove("hidden");
      qrContainer.innerHTML = "<p>Gerando QR Code PIX...</p>";
      pixCodeElement.innerHTML = "";

      try {
        const response = await fetch(`${API_BASE}/create-payment`, {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            amount, description: currentPresente.nome, payerEmail: pixEmail,
            payerName: "Convidado", presenteId: currentPresente.id,
          }),
        });
        const data = await response.json();
        if (data.success) {
          if (data.qrCodeBase64) {
            qrContainer.innerHTML = `<img src="data:image/jpeg;base64,${data.qrCodeBase64}" alt="QR Code PIX" class="w-[200px] h-[200px] mx-auto"><p class="mt-4 text-sm">Escaneie o QR Code com seu banco</p>`;
          } else if (data.qrCode) {
            qrContainer.innerHTML = `<div class="bg-black p-4 rounded-xl inline-block"><img src="https://chart.googleapis.com/chart?chs=200x200&cht=qr&chl=${encodeURIComponent(data.qrCode)}" alt="QR Code PIX" class="w-[200px] h-[200px]"></div><p class="mt-4 text-sm">Escaneie o QR Code com seu banco</p>`;
          }
          pixCodeElement.textContent = data.pixCode || data.qrCode;
          startPaymentPolling(data.paymentId);
          showToast("PIX gerado! Escaneie o QR Code para pagar", "success");
        } else {
          throw new Error(data.error || "Erro ao gerar PIX");
        }
      } catch (error) {
        console.error("Erro ao gerar PIX:", error);
        qrContainer.innerHTML = `<p class="text-red-500">Erro ao gerar PIX</p><p class="text-sm">${error.message}</p><button onclick="generatePixQRCode()" class="mt-4 px-4 py-2 cursor-pointer bg-rosa text-white border-none rounded-lg">Tentar novamente</button>`;
        showToast("Erro ao gerar pagamento PIX. Tente novamente.", "error");
        pixPlaceholder?.classList.remove("hidden");
        pixGeneratedContent?.classList.add("hidden");
      }
    }

                        class="inline-flex items-center gap-1.5 bg-transparent border border-rosa text-rosa px-3 py-1 rounded-full text-[0.7rem] cursor-pointer transition-all duration-300 mt-2 hover:bg-rosa hover:text-white group">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="shrink-0">
                    <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                  </svg>
                  Copiar endereço
                </button>
              </div>
            </div>

            <div class="mt-2">${botoes}</div>
          </div>
        </article>
      `;
      container.innerHTML = html;
    }

    function isValidEmail(email) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
    }

    function startPaymentPolling(paymentId) {
      if (pollingInterval) clearInterval(pollingInterval);
      let attempts = 0;
      const maxAttempts = 60;
      pollingInterval = setInterval(async () => {
        attempts++;
        try {
          const response = await fetch(`${API_BASE}/check-payment?id=${paymentId}`);
          const data = await response.json();
          if (data.success) {
            if (data.status === "approved") {
              clearInterval(pollingInterval); pollingInterval = null;
              showToast("Pagamento confirmado! Obrigado por presentear!", "success");
              closeModal();
              setTimeout(() => window.location.reload(), 2000);
            } else if (data.status === "rejected") {
              clearInterval(pollingInterval); pollingInterval = null;
              showToast("Pagamento recusado. Tente novamente.", "error");
            }
          }
          if (attempts >= maxAttempts) { clearInterval(pollingInterval); pollingInterval = null; }
        } catch (error) { console.error("Erro ao verificar status:", error); }
      }, 5000);
    }

    function copyPixCode() {
      const pixCode = document.getElementById("pixCode").textContent;
      if (pixCode) {
        navigator.clipboard.writeText(pixCode);
        showToast("Código PIX copiado!", "success");
      } else {
        showToast("Nenhum código PIX disponível", "error");
      }
    }

    function openModal() {
      const modal = document.getElementById("paymentModal");
      modal.classList.remove("hidden");
      modal.classList.add("flex");

      const valorLivreDiv = document.getElementById("valorLivreModal");
      if (valorLivreDiv) {
        if (currentPresente && currentPresente.preco === 0) {
          valorLivreDiv.style.display = "block";
          const inputPage = document.getElementById("valorLivreInput");
          const inputModal = document.getElementById("valorLivreInputModal");
          if (inputPage && inputModal) inputModal.value = inputPage.value || "50.00";
        } else {
          valorLivreDiv.style.display = "none";
        }
      }

      const pixPlaceholder = document.getElementById("pixPlaceholder");
      const pixGeneratedContent = document.getElementById("pixGeneratedContent");
      if (pixPlaceholder && pixGeneratedContent) {
        pixPlaceholder.classList.remove("hidden");
        pixGeneratedContent.classList.add("hidden");
      }

      const activeMethod = document.querySelector(".payment-btn.active")?.dataset.method || "pix";
      if (activeMethod === "credit") setTimeout(() => initCreditCardFields(), 100);
      else if (activeMethod === "debit") setTimeout(() => initDebitCardFields(), 100);
    }

    function closeModal() {
      const modal = document.getElementById("paymentModal");
      modal.classList.add("hidden");
      modal.classList.remove("flex");
      setTimeout(() => unmountCardFields(), 300);
      if (pollingInterval) { clearInterval(pollingInterval); pollingInterval = null; }
    }

    function setupPaymentMethodSwitch() {
      document.querySelectorAll(".payment-btn").forEach((btn) => {
        btn.removeEventListener("click", btn._handler);
        const handler = async () => {
          const method = btn.dataset.method;
          document.querySelectorAll(".payment-btn").forEach((b) => {
            b.classList.remove("active", "bg-rosa/10", "border-rosa", "text-rosa");
            b.classList.add("bg-transparent", "border-marrom/20");
          });
          btn.classList.add("active", "bg-rosa/10", "border-rosa", "text-rosa");
          btn.classList.remove("bg-transparent", "border-marrom/20");

          document.querySelectorAll(".payment-content").forEach((c) => {
            c.classList.remove("active");
            c.classList.add("hidden");
          });
          const target = document.getElementById(`${method}Content`);
          target.classList.add("active");
          target.classList.remove("hidden");

          unmountCardFields();

          if (method === "credit") { await initCreditCardFields(); setupDocumentMaskListeners(); }
          else if (method === "debit") { await initDebitCardFields(); setupDocumentMaskListeners(); }
          else if (method === "pix") {
            const pixPlaceholder = document.getElementById("pixPlaceholder");
            const pixGeneratedContent = document.getElementById("pixGeneratedContent");
            if (pixPlaceholder && pixGeneratedContent) {
              pixPlaceholder.classList.remove("hidden");
              pixGeneratedContent.classList.add("hidden");
            }
          }
        };
        btn._handler = handler;
        btn.addEventListener("click", handler);
      });
    }

    async function carregarDetalhePresente() {
      const id = getIdFromURL();
      if (!id) { mostrarErro("ID do presente não informado."); return; }
      try {
        const response = await fetch("/data/presentes.json");
        if (!response.ok) throw new Error(`HTTP ${response.status}: ${response.statusText}`);
        const data = await response.json();
        const presente = data.presentes.find((p) => p.id === parseInt(id));
        if (!presente) { mostrarErro("Presente não encontrado."); return; }
        currentPresente = presente;
        renderizarDetalhe(presente);
      } catch (error) {
        console.error("Erro:", error);
        mostrarErro(`Erro ao carregar detalhes do presente. Detalhe: ${error.message}`);
      }
    }

    document.addEventListener("DOMContentLoaded", async () => {
      setupPaymentMethodSwitch();
      carregarDetalhePresente();
      setupDocumentMaskListeners();

      const creditButton = document.getElementById("creditPaymentButton");
      const debitButton = document.getElementById("debitPaymentButton");
      if (creditButton) creditButton.addEventListener("click", processCreditPayment);
      if (debitButton) debitButton.addEventListener("click", processDebitPayment);
    });

    window.onclick = function (event) {
      const modal = document.getElementById("paymentModal");
      if (event.target === modal) closeModal();
    };
  </script>
</body>
